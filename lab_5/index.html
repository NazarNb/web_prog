<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Акустична варта — Лабораторна робота 5</title>
  <link rel="stylesheet" href="./css/style.css">
</head>
<body>
  <div class="container">
    <header>
      <div class="header-content">
        <h1>Акустична варта</h1>
        <p class="subtitle">Система моніторингу шуму міста Львова</p>
      </div>
      
      <div id="system-stats" class="stats-panel">
        <div class="stat-card">
          <span class="stat-label">Всього датчиків</span>
          <span class="stat-val" id="total-sensors">0</span>
        </div>
        <div class="stat-card stat-critical">
          <span class="stat-label">Критичний шум</span>
          <span class="stat-val" id="critical-sensors">0</span>
        </div>
        <div class="stat-card">
          <span class="stat-label">Середній шум</span>
          <span class="stat-val" id="avg-noise">0 dB</span>
        </div>
      </div>
    </header>

    <div class="controls-panel">
      <div class="filter-group">
        <label for="district-filter">Фільтр за районом:</label>
        <select id="district-filter">
          <option value="all">Усі райони</option>
          <option value="Галицький">Галицький</option>
          <option value="Франківський">Франківський</option>
          <option value="Шевченківський">Шевченківський</option>
          <option value="Сихівський">Сихівський</option>
        </select>
      </div>

      <div class="filter-group">
        <label for="search-id">Пошук за ID:</label>
        <div class="search-box">
          <input type="text" id="search-id" placeholder="Наприклад: NS-02">
          <button id="btn-search">Знайти</button>
          <button id="btn-reset" class="btn-secondary">Скинути</button>
        </div>
      </div>
    </div>

    <main>
      <div id="sensors-container" class="sensors-grid"></div>
    </main>
  </div>

  <script type="module" src="./js/app.js"></script>
</body>
</html>
