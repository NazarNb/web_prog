<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <title>Запропонувати місто</title>
</head>
<body>
    <header>
        <h1>Запропонувати своє місто</h1>
        <nav>
            <a href="index.html">Головна</a> |
            <a href="city_lviv.html">Львів</a> |
            <a href="city_barca.html">Барселона</a> |
            <a href="city_praha.html">Прага</a> |
            <a href="form.html">Запропонувати місто</a>
        </nav>
    </header>
    <hr>
    <main>
        <h2>Яке місто варто додати до рейтингу?</h2>
        <p>Заповніть форму нижче, щоб поділитися своїм улюбленим містом:</p>

        <form action="#" method="post">
            <p>
                <label for="username">Ваше ім'я:</label><br>
                <input type="text" id="username" name="username" required placeholder="Введіть ваше ім'я">
            </p>
            <p>
                <label for="cityname">Назва міста:</label><br>
                <input type="text" id="cityname" name="cityname" required placeholder="Наприклад, Рим чи Токіо">
            </p>
            <p>
                <label for="country">Країна:</label><br>
                <input type="text" id="country" name="country" placeholder="Країна, де розташоване місто">
            </p>
            <p>
                <label for="reason">Чому саме це місто особливе?</label><br>
                <textarea id="reason" name="reason" rows="4" cols="50" placeholder="Опишіть враження або визначні місця..."></textarea>
            </p>
            <p>
                <button type="submit">Надіслати пропозицію</button>
                <button type="reset">Очистити форму</button>
            </p>
        </form>

        <p><a href="index.html">&larr; Повернутися на головну</a></p>
    </main>
    <hr>
    <footer>
        <p><strong>Автор:</strong> Bobyliak Nazar</p>
        <p><strong>Група:</strong> КН-41</p>
    </footer>
</body>
</html>
